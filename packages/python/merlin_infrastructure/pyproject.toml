# merlin_infrastructure — heavy I/O adapters (DB, market data, RQ, observability).
#
# Implements the Protocols defined in merlin_core.application.ports. The
# only package that imports SQLAlchemy, asyncpg, alembic, pgvector,
# httpx-backed market-data clients, and structlog/Sentry.
#
# Forbidden imports (enforced by [tool.importlinter] in the root
# pyproject.toml): `fastapi`, `telegram`, `merlin_api`, `merlin_bot`,
# `merlin_worker`, `merlin_client`. Infrastructure is shared by both api
# and worker; it must not know which it's running inside.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "merlin-infrastructure"
version = "0.1.0"
description = "Merlin infrastructure adapters — DB, market data, RQ, observability."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Merlin Team" }]
dependencies = [
    "merlin-core",
    # Database
    "sqlalchemy[asyncio]>=2.0,<3",
    "asyncpg>=0.30,<1",
    "alembic>=1.14,<2",
    # pgvector Python package provides SQLAlchemy types for the
    # vector(384) column (sentence-transformers/all-MiniLM-L6-v2).
    "pgvector>=0.3,<1",
    # Logging — structured JSON in prod, pretty in dev.
    "structlog>=24.4,<25",
    # Bare sentry-sdk only. The FastAPI integration extra (`sentry-sdk[fastapi]`)
    # belongs to merlin-api so it doesn't leak into the bot/worker images.
    "sentry-sdk>=2.18,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "testcontainers[postgres,redis]>=4.8",
    "syrupy>=4.7",
]

# Two-layer flat layout — see ADR (q) in docs/ARCHITECTURE.md.
# `alembic/` lives at the package root (not inside the importable
# Python package) because migrations are repository artifacts, not
# library code. `make db-migrate` runs `cd packages/python/merlin_infrastructure/alembic`.
[tool.hatch.build.targets.wheel]
packages = ["merlin_infrastructure"]
