# Alembic configuration for merlin_infrastructure.
#
# Migrations live with the package that owns the models — see ADR (l)
# in docs/ARCHITECTURE.md. Run via `make db-migrate` / `make db-revision m=...`.

[alembic]
script_location = .
prepend_sys_path = .
version_path_separator = os
sqlalchemy.url = postgresql+asyncpg://merlin:merlin@localhost:5432/merlin

# Use a deterministic revision template so file names are scannable.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Output formatting — async-safe.
[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
