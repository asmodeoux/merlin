# Dev compose — hot reload + debugpy on api/bot/worker, custom postgres
# (pgvector only — Q-029 [PROPOSED] drops pg_cron), redis. Volume mounts
# for source so edits land without rebuilds. `make dev-up` is the entry
# point; `make dev-verify` boots this compose then polls /health + /ready
# and greps bot+worker logs for the startup line.

name: merlin-dev

services:
  postgres:
    build:
      context: ./postgres-dev
    environment:
      POSTGRES_USER: merlin
      POSTGRES_PASSWORD: merlin
      POSTGRES_DB: merlin
    # Host port is 5433 to avoid clashing with a native Postgres on
    # 5432; inside the compose network the API/worker still reach this
    # container on 5432 via the service name (``postgres:5432``).
    ports:
      - "5433:5432"
    volumes:
      - merlin_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U merlin -d merlin"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    # Host port is 6380 to avoid clashing with a native Redis on 6379;
    # services in the compose network reach this container on the
    # default 6379 via ``redis://redis:6379/0``.
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  merlin-api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
      target: dev
    # Real secrets live in ``apps/api/.env`` (gitignored, populated by
    # ``cp .env.example .env`` + paste). ``.env.example`` only has empty
    # placeholders; pointing compose at it would silently break the
    # OpenRouter / CoinGecko paths.
    env_file: ../apps/api/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://merlin:merlin@postgres:5432/merlin
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"   # FastAPI
      - "5678:5678"   # debugpy
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../apps/api:/app/apps/api
      - ../packages/python:/app/packages/python

  merlin-bot:
    build:
      context: ..
      dockerfile: apps/bot/Dockerfile
      target: dev
    env_file: ../apps/bot/.env
    environment:
      MERLIN_API_BASE_URL: http://merlin-api:8000
      REDIS_URL: redis://redis:6379/1
    ports:
      - "5679:5679"   # debugpy
    depends_on:
      - merlin-api
      - redis
    volumes:
      - ../apps/bot:/app/apps/bot
      - ../packages/python:/app/packages/python

  merlin-worker:
    build:
      context: ..
      dockerfile: apps/worker/Dockerfile
      target: dev
    env_file: ../apps/worker/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://merlin:merlin@postgres:5432/merlin
      REDIS_URL: redis://redis:6379/0
    ports:
      - "5680:5680"   # debugpy
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../apps/worker:/app/apps/worker
      - ../packages/python:/app/packages/python

volumes:
  merlin_pg_data:
