# merlin-bot — Telegram bot (python-telegram-bot v21+).
#
# Talks to the API over HTTP via `merlin_client`. Forbidden imports
# (enforced by [tool.importlinter]): `sqlalchemy`, `fastapi`,
# `merlin_core.domain`, `merlin_core.application`, `merlin_infrastructure`,
# `merlin_api`, `merlin_worker`. The bot is an HTTP client and a
# rendering layer; it never sees a DB session or a domain entity.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "merlin-bot"
version = "0.1.0"
description = "Merlin Telegram bot — PTB v21 + merlin_client + merlin_core.contracts."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Merlin Team" }]
dependencies = [
    "merlin-core",
    "merlin-client",
    # Opt-in PTB extras — rate limiter (TG 30 msg/s ceiling), typed
    # CallbackData (no string parsing), JobQueue (post_init hooks),
    # webhooks (prod transport).
    "python-telegram-bot[rate-limiter,callback-data,job-queue,webhooks]>=21.6,<22",
    "pydantic-settings>=2.6,<3",
    # Bare sentry-sdk only — no FastAPI extra in the bot image.
    "sentry-sdk>=2.18,<3",
    # Redis-backed BasePersistence (production) — DictPersistence is
    # PTB stdlib (no extra dep).
    "redis>=5.2,<6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "pytest-httpx>=0.34",
    "syrupy>=4.7",
    "watchdog>=6",  # `watchmedo auto-restart` for dev hot reload
    "debugpy>=1.8",
    # fakeredis backs the RedisPersistence unit tests so they don't
    # require a live Redis (the integration suite still uses the real
    # service in docker-compose.test.yml).
    "fakeredis>=2.26",
]

[tool.hatch.build.targets.wheel]
packages = ["merlin_bot"]
