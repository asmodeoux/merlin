# fly.toml for merlin-api.
#
# Phase 0: deploy to a single Fly app (`merlin-api`) in IAD. Phase 1
# extends with autoscaling + multi-region. Secrets are set via
# `fly secrets set MERLIN_API_INTERNAL_TOKEN=... DATABASE_URL=... ...`
# — never checked into the repo.

app = "merlin-api"
primary_region = "iad"
kill_signal = "SIGINT"
kill_timeout = "30s"

[build]
  dockerfile = "Dockerfile"

[build.args]
  TARGET = "prod"

# Run alembic before traffic flips. If migrations fail, Fly aborts the
# release and the currently-serving machine keeps the previous version.
# IMPORTANT: never duplicate this on apps/bot/fly.toml or
# apps/worker/fly.toml — running migrations from multiple apps races on
# alembic_version. The preflight test in tests/preflight/
# test_fly_release_command.py enforces this single-app invariant.
#
# `cd` is required: alembic resolves `script_location = .` (in
# packages/python/merlin_infrastructure/alembic/alembic.ini) against
# the cwd, not the ini's directory. Same pattern as `make db-migrate`.
[deploy]
  release_command = "sh -c 'cd packages/python/merlin_infrastructure/alembic && uv run --package merlin-api alembic upgrade head'"

[env]
  ENVIRONMENT = "prod"
  LOG_LEVEL   = "INFO"

[http_service]
  internal_port    = 8000
  force_https      = true
  # API machines stay always-on rather than auto-stopping. Reasoning:
  # the bot calls the API via `http://merlin-api.internal:8000` (direct
  # 6PN to uvicorn, no Flycast edge proxy hop). Direct 6PN traffic
  # does NOT trigger Fly's auto_start, so any request hitting a
  # stopped machine fails outright (the bot's `MerlinClient` doesn't
  # retry across DNS entries). Cost: 2 × shared-cpu-1x@512MB ≈ $6.64/mo,
  # paid for predictable internal calls. Revisit if we ever route the
  # bot via Flycast on port 80/443.
  auto_stop_machines  = "off"
  auto_start_machines = true
  min_machines_running = 2

  [[http_service.checks]]
    method   = "GET"
    path     = "/health"
    interval = "10s"
    timeout  = "3s"
    grace_period = "10s"

  [[http_service.checks]]
    method   = "GET"
    path     = "/ready"
    interval = "30s"
    timeout  = "3s"
    grace_period = "30s"

[[vm]]
  cpu_kind = "shared"
  cpus     = 1
  memory   = "512mb"
