# fly.toml for merlin-api.
#
# Phase 0: deploy to a single Fly app (`merlin-api`) in IAD. Phase 1
# extends with autoscaling + multi-region. Secrets are set via
# `fly secrets set MERLIN_API_INTERNAL_TOKEN=... DATABASE_URL=... ...`
# — never checked into the repo.

app = "merlin-api"
primary_region = "iad"
kill_signal = "SIGINT"
kill_timeout = "30s"

[build]
  dockerfile = "Dockerfile"

[build.args]
  TARGET = "prod"

[env]
  ENVIRONMENT = "prod"
  LOG_LEVEL   = "INFO"

[http_service]
  internal_port    = 8000
  force_https      = true
  auto_stop_machines  = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method   = "GET"
    path     = "/health"
    interval = "10s"
    timeout  = "3s"
    grace_period = "10s"

  [[http_service.checks]]
    method   = "GET"
    path     = "/ready"
    interval = "30s"
    timeout  = "3s"
    grace_period = "30s"

[[vm]]
  cpu_kind = "shared"
  cpus     = 1
  memory   = "512mb"
