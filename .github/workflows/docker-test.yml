# Docker test — build the prod-target images for api/bot/worker and
# run the integration suite against them via docker-compose.test.yml.
# This is the last line of defense — "would the prod image we'd ship
# actually serve traffic?".

name: docker-test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  docker-test:
    name: prod-image integration suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: docker compose build + up + runner
        run: |
          docker compose -f deploy/docker-compose.test.yml up \
            --build \
            --abort-on-container-exit \
            --exit-code-from runner
