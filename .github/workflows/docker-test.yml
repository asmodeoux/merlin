# Docker build — build the production images for api/bot/worker so a
# broken Dockerfile fails CI. The integration tests themselves run in
# ci.yml (they start their own Postgres via testcontainers).

name: docker-test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  docker-test:
    name: build prod images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: docker compose build
        run: docker compose -f deploy/docker-compose.test.yml build
